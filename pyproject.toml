[project]
name = "huutoapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "types-aiofiles>=25.1.0.20260518",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
huutoapi = [
    "fastapi[standard]>=0.162.0",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.0",
    "redis>=8.0.1",
]
huutoworker = [
    "httpx>=0.28.1",
    "redis>=8.0.1",
    "starlette>=1.3.1",
]
huutomcp = [
    "fastmcp>=4.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]
