literals:
  media_format:
    - "DVD"
    - "Blu-ray"
    - "4K Ultra HD"
  condition:
    - "new"
    - "like-new"
    - "good"
    - "acceptable"
    - "weak"
  status:
    - "draft"
    - "closed"
    - "open"

tools:
  list_titles:
    description: >
      List physical media items currently for sale. Supports optional independent filters for media format, condition, and listing status. 
      Omitting a filter returns items unrestricted on that field.
      Filters are combined with AND logic and that omitted filters mean there's no restriction on that field.
    parameters:
      media_format: >
        Optional filter by physical media format.
        Accepted values (exact match): DVD, Blu-ray, 4K Ultra HD.
      condition: >
        Optional filter by item condition.
        Accepted values (exact match): new, like-new, good, acceptable, weak.
      status: >
        Optional filter by listing status.
        Accepted values (exact match): draft, closed, open.

  search_titles:
    description: >
      Search items currently for sale using a simple keyword query.

      Use this tool when the user provides a free-text or keyword search
      (e.g. movie title, cast or crew member, genre, year, or physical media label).

      Prefer this tool over more structured filters when the user does not
      specify exact field values.
    parameters:
      search_criteria: >
        Keyword or free-text search query. Matched against title, description, keywords, cast and crew, genre, 
        release year and physical media labels.
        Examples: 'charles bronson', '1974', 'film-noir', 'criterion'.

  publish_draft_title:
    description: >
      Publish a draft title to Huuto.net.

      The title must currently be in draft status (use list_titles with status="draft" to find candidates).
      Publishing makes the listing publicly visible and changes its status to open.
      When the title is successfully published by the background worker, huuto_id and huuto_closing_time are set (previously null).
      Optionally includes keywords in the published title when add_keywords is true.
    parameters:
      title_id: >
        Database ID of the title to publish.
        Obtain this value from the list_titles tool (the 'id' field of a matching item).
      add_keywords: >
        When true, include the title's keywords in the published listing on Huuto.net.
        When false, publish without adding keywords.

  republish_title:
    description: >
      Republish an existing title (open or closed) to Huuto.net.

      Use this for titles that are already published or closed. It refreshes the listing on Huuto.net and keeps (or restores) it in the open state.
      The title must not be in draft status (use list_titles with status="open" or status="closed" to find candidates).
      When the title is successfully republished by the background worker, huuto_id and huuto_closing_time are updated with new values.
      Optionally includes keywords in the republished title when add_keywords is true.
    parameters:
      title_id: >
        Database ID of the title to republish.
        Obtain this value from the list_titles tool (the 'id' field of a matching item).
      add_keywords: >
        When true, include the title's keywords in the republished listing on Huuto.net.
        When false, republish without adding keywords.
